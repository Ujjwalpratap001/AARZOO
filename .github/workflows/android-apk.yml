name: Build AARZOO APK

on:
  push:
    branches: [main]
    paths:
      - 'AARZOO_2.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q AARZOO_2.zip -d extracted
          echo "Extracted project files:"
          find extracted -maxdepth 4 -type f | head -80

      - name: Locate Gradle project and build APK
        run: |
          WRAPPER="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "::error::No Gradle wrapper (gradlew) was found inside AARZOO_2.zip. Upload the complete Android Studio project, including gradlew and gradle/wrapper, then rerun this workflow."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          chmod +x "$WRAPPER"
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AARZOO-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
