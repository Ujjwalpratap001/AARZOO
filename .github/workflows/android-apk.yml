name: Build AARZOO APK

on:
  push:
    branches: [main]
    paths:
      - 'AARZOO_2.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract app and install dependencies
        run: |
          mkdir -p extracted
          unzip -q AARZOO_2.zip -d extracted
          cd extracted
          echo "App package configuration:"
          cat package.json
          npm install

      - name: Generate Android project and build APK
        run: |
          cd extracted
          if [ ! -d android ]; then
            CAP_VERSION="$(node -e "const p=require('./package.json'); const v=(p.dependencies||{})['@capacitor/core']||(p.devDependencies||{})['@capacitor/core']; if(!v) process.exit(1); console.log(v.replace(/^[^0-9]*/,''))")"
            echo "Using Capacitor version: $CAP_VERSION"
            npm install --no-save "@capacitor/cli@$CAP_VERSION" "@capacitor/android@$CAP_VERSION"
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AARZOO-debug-apk
          path: extracted/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
