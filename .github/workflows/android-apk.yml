name: Build and Publish UDAAN APK

on:
  push:
    branches: [main]
    paths:
      - 'AARZOO_2.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract app and install dependencies
        run: |
          mkdir -p extracted
          unzip -q AARZOO_2.zip -d extracted
          cd extracted
          echo "App package configuration:"
          cat package.json
          npm install

      - name: Generate Android project and build APK
        run: |
          cd extracted
          if [ ! -d android ]; then
            CAP_VERSION="$(node -e "const p=require('./package.json'); const v=(p.dependencies||{})['@capacitor/core']||(p.devDependencies||{})['@capacitor/core']; if(!v) process.exit(1); console.log(v.replace(/^[^0-9]*/,''))")"
            echo "Using Capacitor version: $CAP_VERSION"
            npm install --no-save "@capacitor/cli@$CAP_VERSION" "@capacitor/android@$CAP_VERSION"
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/UDAAN.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UDAAN-APK
          path: UDAAN.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: UDAAN Android App v1.0.0
          body: |
            First installable Android debug build of UDAAN.
            
            Download UDAAN.apk below and install it on your Android phone.
          files: UDAAN.apk
          make_latest: true
          fail_on_unmatched_files: true
